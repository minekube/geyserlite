version: "2"

linters:
  default: standard
  exclusions:
    rules:
      # The deferred-Close / RemoveAll / Chdir idiom is intentionally
      # fire-and-forget for cleanup paths.
      - linters: [errcheck]
        path: '\.go$'
        text: 'Error return value of .+(Close|RemoveAll|Chdir).+ is not checked'
      # The frozen native callback ABI delivers validated native memory as
      # integer addresses; copyNativeBytes synchronously copies and retains no pointer.
      - linters: [govet]
        path: '^embedded_ingress\.go$'
        text: 'possible misuse of unsafe.Pointer'
