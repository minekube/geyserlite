name: Release Please

# Closes the auto-sustaining loop.
#
# Renovate auto-merges Geyser bumps into main when CI is green. That
# updates the .so/ELF/container at :latest but doesn't cut a tag, so
# Go-module + crates.io consumers stay frozen on the last manual tag.
#
# This workflow uses google-github-actions/release-please-action to
# parse Conventional Commit messages on main and open a release PR
# that bumps Cargo.toml + the auto-download Default*Version constants
# to the next patch (or minor / major, per the commit prefix). Merging
# the release PR pushes the v* tag, which fans out to:
#   - release.yml: GH Release with cosign-signed artifacts
#   - release.yml: crates.io OIDC Trusted Publishing
#   - release.yml: Gate dependency bump after release assets are uploaded
#   - native-image.yml's :latest tag (already on main; tag is informational)
#
# Conventional Commit prefixes that drive a release:
#   fix:   → patch (0.1.2 → 0.1.3)
#   feat:  → minor (0.1.2 → 0.2.0)
#   feat!: → major (0.1.2 → 1.0.0)
# anything else (chore:, docs:, build:, ci:, refactor:, test:) → no release.
#
# Renovate is configured (renovate.json) to use "fix:" prefixes
# for Geyser bumps so they trip a patch release automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write    # to gh workflow run release.yml
  checks: write     # to mirror release-branch CI onto the required PR check
  statuses: write   # to satisfy branch protection for GITHUB_TOKEN release PRs

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_number: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # release-type=simple just tracks the version in version.txt /
          # cargo via release-please-config.json. We use a manifest
          # config so the same release covers both Go and Rust at once.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Pull requests created by GITHUB_TOKEN do not trigger pull_request
      # workflows. Run the same CI workflow on the release branch explicitly,
      # mirror its result to the required lint-test context, merge the validated
      # PR, and dispatch this workflow once more on main so release-please can
      # create the tag. GITHUB_TOKEN-created merges do not fire push workflows.
      #
      # The exception is the approval-gated run GitHub still creates for a
      # GITHUB_TOKEN pull request (opened/synchronize/reopened): it never gets
      # approved, so it resolves to `failure` with 0 jobs when the release PR is
      # merged. That run is the red `CI` check on every release PR; the
      # acceptance note in ci.yml explains why it must never become a required
      # check, and go/release_check_contract_test.go pins the facts behind it.
      - name: Validate release PR
        if: ${{ steps.rp.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release PR payload is JSON that repeats the merged commit subjects
          # verbatim, so it must reach the shell as DATA. The pre-fix step built
          # its command from a single-quoted shell literal
          # (`echo '${{ steps.rp.outputs.pr }}' | jq -r '.number'`): one apostrophe
          # in a merged subject (`don't`, `geyserlite's`) closed the literal, the
          # rest of the payload was parsed as shell code, and the step died with
          # `syntax error near unexpected token `('` — the release PR then never
          # merged and the whole chain silently skipped the tag. Passed through
          # the environment, the payload is never parsed by the shell. Pinned by
          # TestReleasePleaseMergeStepNeverInterpolatesPayloadIntoShell and the
          # apostrophe harness in release_please_payload_test.go.
          RP_PR: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail

          # Parsed from the environment, never from script text.
          PR_NUMBER=$(printf '%s' "$RP_PR" | jq -r '.number')
          PR_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid)
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')

          echo "Dispatching CI for release PR #$PR_NUMBER at $HEAD_REF ($HEAD_SHA)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --json databaseId,headSha \
              --jq "map(select(.headSha == \"$HEAD_SHA\")) | .[0].databaseId // \"\"")
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for dispatched CI run to appear"
            exit 1
          fi

          echo "Waiting for CI run $RUN_ID"
          for _ in $(seq 1 180); do
            RUN_JSON=$(gh run view "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion,url)
            STATUS=$(echo "$RUN_JSON" | jq -r '.status')
            CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion // ""')
            RUN_URL=$(echo "$RUN_JSON" | jq -r '.url')
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            sleep 10
          done

          if [ "$STATUS" != "completed" ]; then
            echo "::error::Timed out waiting for CI run $RUN_ID"
            exit 1
          fi

          CHECK_CONCLUSION="$CONCLUSION"
          if [ "$CHECK_CONCLUSION" = "cancelled" ]; then
            CHECK_CONCLUSION="neutral"
          fi

          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='lint-test' \
            -f head_sha="$HEAD_SHA" \
            -f status='completed' \
            -f conclusion="$CHECK_CONCLUSION" \
            -f details_url="$RUN_URL" \
            -f output[title]="Release PR CI $CONCLUSION" \
            -f output[summary]="Mirrors workflow_dispatch CI run $RUN_ID for release PR #$PR_NUMBER: $RUN_URL"

          STATUS_STATE="failure"
          if [ "$CONCLUSION" = "success" ]; then
            STATUS_STATE="success"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$STATUS_STATE" \
            -f context='lint-test' \
            -f target_url="$RUN_URL" \
            -f description="Release PR CI $CONCLUSION via workflow_dispatch"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Release PR CI concluded $CONCLUSION"
            exit 1
          fi

          # Review gate: the release PR must not merge before CodeRabbit has
          # actually reviewed this head commit. The step used to go straight
          # from the mirrored `lint-test` context to `gh pr merge`, so the
          # merge closed the PR mid-review and GitHub recorded the review run
          # as `cancelled`: #256 merged 2026-11-03T06:37:31Z while its
          # CodeRabbit check (started 06:33:23Z) was still running and was
          # cancelled at 06:38:29Z; #251 merged 2026-10-31T20:29:46Z with the
          # same shape. CodeRabbit is deliberately NOT a required
          # branch-protection context: that is a settings change nobody can
          # review here, and a required context an external reviewer app can
          # leave `cancelled` would block the pull request UI as well. The gate
          # lives in this workflow so it is reviewable and fail-closed.
          #
          # Only `success` may merge, plus `neutral`/`skipped`, whose detail is
          # recorded in the job summary (CodeRabbit reports "No files to
          # review" as `skipped`). Any other conclusion, a check that never
          # appears at all, and no terminal result inside the cap all leave the
          # PR open and stop the chain before anything is tagged.
          #
          # The cap is a wall-clock deadline, not a count of sleeps: it is
          # computed once below, re-checked before every request, the trailing
          # sleep is clipped to the time that is left, and each request is
          # capped by `timeout` (at $REVIEW_REQUEST_SECONDS, or at whatever is
          # left of the budget when that is smaller). A cap that only counted
          # sleep time was not a cap at all: one stalled HTTP call sat outside
          # it, and the step has no job-level timeout to fall back on. A failed
          # or timed-out request is a non-terminal poll — the detail is recorded
          # as `request failed`, polling continues inside the budget, and a
          # persistent failure falls through to the same refusal as an unclear
          # conclusion, so the job summary and the error annotation are always
          # written. The contract tests rewrite these literals to prove the cap
          # without waiting it out, and pin the shipped values in
          # go/release_review_gate_test.go.
          REVIEW_WAIT_SECONDS=900
          REVIEW_POLL_SECONDS=15
          REVIEW_REQUEST_SECONDS=60
          REVIEW_FILTER='([.check_runs[] | select(.name == "CodeRabbit")] | sort_by(.started_at) | last)'
          echo "Waiting up to $REVIEW_WAIT_SECONDS seconds for CodeRabbit to review $HEAD_SHA"
          REVIEW_DEADLINE=$(( $(date -u +%s) + REVIEW_WAIT_SECONDS ))
          REVIEW_STATUS="missing"
          REVIEW_CONCLUSION=""
          REVIEW_REASON=""
          REVIEW_FAILURES=0
          while :; do
            REVIEW_REMAINING=$((REVIEW_DEADLINE - $(date -u +%s)))
            if [ "$REVIEW_REMAINING" -le 0 ]; then
              break
            fi
            REVIEW_TIMEOUT="$REVIEW_REQUEST_SECONDS"
            if [ "$REVIEW_TIMEOUT" -gt "$REVIEW_REMAINING" ]; then
              REVIEW_TIMEOUT="$REVIEW_REMAINING"
            fi
            if ! { REVIEW_JSON=$(timeout "$REVIEW_TIMEOUT" gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100") \
              && REVIEW_STATUS=$(echo "$REVIEW_JSON" | jq -r "$REVIEW_FILTER | .status // \"missing\"") \
              && REVIEW_CONCLUSION=$(echo "$REVIEW_JSON" | jq -r "$REVIEW_FILTER | .conclusion // \"\"") \
              && REVIEW_REASON=$(echo "$REVIEW_JSON" | jq -r "$REVIEW_FILTER | .output.title // \"\""); }; then
              REVIEW_FAILURES=$((REVIEW_FAILURES + 1))
              REVIEW_REASON="request failed"
            fi
            if [ "$REVIEW_STATUS" = "completed" ]; then
              break
            fi
            REVIEW_REMAINING=$((REVIEW_DEADLINE - $(date -u +%s)))
            if [ "$REVIEW_REMAINING" -le 0 ]; then
              break
            fi
            REVIEW_SLEEP="$REVIEW_POLL_SECONDS"
            if [ "$REVIEW_SLEEP" -gt "$REVIEW_REMAINING" ]; then
              REVIEW_SLEEP="$REVIEW_REMAINING"
            fi
            sleep "$REVIEW_SLEEP"
          done

          REVIEW_OUTCOME="$REVIEW_CONCLUSION"
          if [ -z "$REVIEW_OUTCOME" ]; then
            REVIEW_OUTCOME="no terminal result"
          fi
          if [ -z "$REVIEW_REASON" ]; then
            REVIEW_REASON="none"
          fi

          REVIEW_APPROVED="false"
          case "$REVIEW_OUTCOME" in
            success | neutral | skipped)
              REVIEW_APPROVED="true"
              ;;
          esac

          printf '### CodeRabbit review gate\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| field | value |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| release PR | #%s |\n' "$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          printf '| head commit | %s |\n' "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '| check status | %s |\n' "$REVIEW_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf '| conclusion | %s |\n' "$REVIEW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf '| detail | %s |\n' "$REVIEW_REASON" >> "$GITHUB_STEP_SUMMARY"
          printf '| wait limit | %ss |\n' "$REVIEW_WAIT_SECONDS" >> "$GITHUB_STEP_SUMMARY"
          printf '| request failures | %s |\n' "$REVIEW_FAILURES" >> "$GITHUB_STEP_SUMMARY"
          printf '| merge | %s |\n\n' "$REVIEW_APPROVED" >> "$GITHUB_STEP_SUMMARY"

          if [ "$REVIEW_APPROVED" != "true" ]; then
            printf 'Release PR #%s NOT merged (CodeRabbit: %s). Merge by hand if acceptable, else re-run the review.\n' "$PR_NUMBER" "$REVIEW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CodeRabbit review of $HEAD_SHA concluded $REVIEW_OUTCOME; release PR #$PR_NUMBER stays open and no tag is cut"
            exit 1
          fi

          # The gate is about the reviewed commit: if the release branch moved
          # while CodeRabbit was reviewing, the merge would land a commit
          # nobody reviewed.
          MERGED_HEAD_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq '.headRefOid')
          if [ "$MERGED_HEAD_SHA" != "$HEAD_SHA" ]; then
            printf 'Release PR #%s head is %s after CodeRabbit reviewed %s; not merging an unreviewed commit.\n' "$PR_NUMBER" "$MERGED_HEAD_SHA" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Release PR #$PR_NUMBER head moved from the reviewed $HEAD_SHA to $MERGED_HEAD_SHA; not merging"
            exit 1
          fi

          echo "Merging release PR #$PR_NUMBER"
          for _ in $(seq 1 30); do
            if gh pr merge "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --merge \
              --match-head-commit "$HEAD_SHA"; then
              break
            fi
            STATE=$(gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json state \
              --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            sleep 10
          done

          STATE=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json state \
            --jq '.state')
          if [ "$STATE" != "MERGED" ]; then
            echo "::error::Release PR #$PR_NUMBER did not merge"
            exit 1
          fi

          gh workflow run release-please.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

  # release-please pushes the v* tag with GITHUB_TOKEN, which by
  # design doesn't fire downstream workflows (GitHub's anti-recursion
  # safeguard). Without this step the v* tag exists but release.yml
  # never runs — empty GH Release, no crates.io publish, no artifacts.
  # Explicitly dispatching release.yml on the freshly-tagged ref
  # closes the loop without needing a PAT.
  trigger-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release.yml on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same boundary as the step above: the tag name reaches the shell
          # through the environment, so no expression is rendered into the
          # script text.
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
