name: Release

on:
  push:
    tags:
      - 'v*'
  # release-please-action's bot pushes the tag with GITHUB_TOKEN,
  # which doesn't fire downstream workflows. release-please.yml's
  # trigger-release job invokes this workflow via workflow_dispatch
  # on the tag ref to close that loop without needing a PAT.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish or repair. Empty uses the workflow ref.
        required: false
        type: string
      skip_crates_publish:
        description: Skip crates.io publish when repairing an existing GitHub Release.
        required: false
        default: false
        type: boolean

permissions:
  contents: write    # GitHub Release upload
  packages: write    # GHCR (if we ever sign the OCI image at release time)
  id-token: write    # cosign keyless + crates.io Trusted Publishing OIDC
  actions: read      # locate and download matching native-image artifacts

jobs:
  release:
    runs-on: ubuntu-latest
    # crates.io's Trusted Publisher binds to a (repository, workflow,
    # environment) triple. Naming the env "release" + matching it on the
    # crates.io side prevents tag-pushers from publishing if they're
    # somehow able to bypass branch protection on this workflow.
    environment: release

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: jdx/mise-action@v4
        with:
          cache: true
          experimental: true

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Pull native artifacts for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          # Release commits usually only bump metadata. The native assets
          # belong to the latest reachable commit that changed native build
          # inputs, so wait for that exact native-image.yml run instead of
          # racing against "latest successful" artifacts from an older commit.
          NATIVE_SHA=$(git log -n 1 --format=%H -- \
            build \
            mise.toml \
            .github/workflows/native-image.yml)

          if [ -z "$NATIVE_SHA" ]; then
            echo "::error::Could not resolve native artifact source commit"
            exit 1
          fi

          echo "Waiting for native-image.yml artifacts from $NATIVE_SHA"
          RUN_ID=""
          RUN_URL=""
          for _ in $(seq 1 240); do
            RUN_JSON=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow=native-image.yml \
              --branch=main \
              --limit=100 \
              --json databaseId,headSha,status,conclusion,url,createdAt \
              --jq "map(select(.headSha == \"$NATIVE_SHA\")) | sort_by(.createdAt) | reverse | .[0] // {}")

            RUN_ID=$(echo "$RUN_JSON" | jq -r '.databaseId // ""')
            STATUS=$(echo "$RUN_JSON" | jq -r '.status // ""')
            CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion // ""')
            RUN_URL=$(echo "$RUN_JSON" | jq -r '.url // ""')

            if [ -z "$RUN_ID" ]; then
              echo "No native-image.yml run for $NATIVE_SHA yet; waiting..."
              sleep 10
              continue
            fi

            echo "native-image.yml run $RUN_ID is $STATUS/$CONCLUSION: $RUN_URL"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                break
              fi
              echo "::error::native-image.yml run $RUN_ID concluded $CONCLUSION"
              exit 1
            fi

            sleep 10
          done

          if [ -z "$RUN_ID" ] || [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Timed out waiting for successful native-image.yml artifacts from $NATIVE_SHA"
            exit 1
          fi

          # Only download our own upload-artifact outputs; skip the
          # docker/build-push-action build-summary blobs (which gh run
          # download mistakes for zips and chokes on).
          gh run download "$RUN_ID" --dir artifacts --pattern 'geyserlite-*'
          ls -la artifacts/

      - name: Generate checksums.txt
        # The auto-download path in go/ and rust/ resolves asset SHAs
        # against this file at <download-base>/<tag>/checksums.txt.
        # Format: "<sha256>  <filename>" — one per line, sha256sum-compatible.
        run: |
          ( cd artifacts
            shopt -s globstar nullglob
            for f in **/*; do
              [ -f "$f" ] || continue
              # Strip the upload-artifact subdir prefix so the file name
              # in checksums.txt matches the released asset name.
              base="$(basename "$f")"
              case "$base" in *.sig|*.attest.spdx.json|checksums.txt) continue;; esac
              sha256sum "$f" | awk -v b="$base" '{ print $1 "  " b }'
            done | sort -k2 > /tmp/checksums.txt
          )
          mv /tmp/checksums.txt artifacts/checksums.txt
          cat artifacts/checksums.txt

      - name: cosign sign release artifacts
        run: |
          for f in artifacts/**/*; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: Generate SBOM attestations
        run: |
          for f in artifacts/**/*.so artifacts/**/geyserlite-*; do
            [ -f "$f" ] || continue
            cosign attest-blob --yes --predicate <(echo "{}") --type spdx --output-attestation "${f}.attest.spdx.json" "$f" || true
          done

      - name: Create GitHub Release
        # Fresh releases only. A repair goes through the step below, which
        # never touches release metadata.
        if: ${{ !inputs.release_tag }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*

      # Repairing an existing release must not go through
      # softprops/action-gh-release: it calls PATCH /releases/{id} to sync
      # release metadata BEFORE uploading anything, and that PATCH now returns
      # "403 Resource not accessible by integration" for these releases. The
      # upload is never even attempted -- four backfill runs for v0.3.6-v0.3.9
      # died there with every artifact already built and signed.
      #
      # `gh release upload` only POSTs to /releases/{id}/assets. Confirmed
      # working against the same 403-ing release with the same token.
      - name: Repair release assets
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          # upload-artifact nests files per architecture; the released asset
          # name is the basename. Duplicates across arch dirs (libgeyserlite.h)
          # are byte-identical, so last-write-wins is safe here.
          mkdir -p upload
          find artifacts -type f -exec sh -c 'cp -f "$1" "upload/$(basename "$1")"' _ {} \;
          ls -la upload/

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No published release exists for $RELEASE_TAG to repair."
            echo "::error::Repair fills holes in an existing release; it does not create one."
            exit 1
          fi

          RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")

          BUILD_FILTER='[.assets[]
            | select(.state == "uploaded")
            | select(.name | test("^checksums\\.txt$|^SHA(256|512)SUMS$|^LICENSE|^README|\\.sig$|\\.sigstore\\.json$|\\.attest\\.spdx\\.json$|\\.spdx\\.json$|\\.asc$|\\.pem$|\\.sha256$|\\.h$|\\.hpp$|\\.md$|\\.txt$") | not)
            | select(.size > 0)]'

          EXISTING_BUILDS=$(echo "$RELEASE_JSON" | jq "$BUILD_FILTER | length")
          HAS_CHECKSUMS=$(echo "$RELEASE_JSON" \
            | jq '[.assets[] | select(.name == "checksums.txt" and .state == "uploaded")] | length')

          # GUARD 1: repair is for releases with missing artifacts. A release
          # that already carries a real build and its manifest is complete;
          # re-uploading over it would replace artifacts nobody asked us to
          # touch, and those are what consumers have already checksummed.
          if [ "$EXISTING_BUILDS" -gt 0 ] && [ "$HAS_CHECKSUMS" -gt 0 ]; then
            echo "::error::Release $RELEASE_TAG already has $EXISTING_BUILDS build artifact(s) and checksums.txt."
            echo "::error::Refusing to modify a complete release. Repair fills holes only."
            exit 1
          fi

          # GUARD 2: never clobber an existing GOOD asset. Only names that are
          # absent, or present in a non-uploaded/zero-byte (failed upload)
          # state, are eligible. --clobber then applies solely to those holes.
          UPLOAD_LIST=""
          SKIPPED=""
          for f in upload/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            good=$(echo "$RELEASE_JSON" | jq -r --arg n "$base" \
              '[.assets[] | select(.name == $n and .state == "uploaded" and .size > 0)] | length')
            if [ "$good" -gt 0 ]; then
              SKIPPED="$SKIPPED $base"
            else
              UPLOAD_LIST="$UPLOAD_LIST $f"
            fi
          done

          if [ -n "$SKIPPED" ]; then
            echo "Keeping existing good assets (not clobbered):$SKIPPED"
          fi

          if [ -z "$UPLOAD_LIST" ]; then
            echo "::error::Nothing to upload for $RELEASE_TAG: every built file is already published."
            exit 1
          fi

          echo "Uploading missing assets:$UPLOAD_LIST"
          # shellcheck disable=SC2086
          gh release upload "$RELEASE_TAG" $UPLOAD_LIST --clobber --repo "$GITHUB_REPOSITORY"

      # A release that publishes no downloadable asset is indistinguishable
      # from a healthy one: the run is green, the release page exists, and
      # the hole only surfaces weeks later when a consumer's auto-download
      # 404s on checksums.txt. That is exactly how v0.3.3, v0.3.7-v0.3.9 and
      # v0.3.20-v0.4.8 shipped without a real build, while v0.3.6 shipped
      # only the C header, without anyone noticing.
      #
      # This re-reads the PUBLISHED release from the API instead of trusting
      # the upload step above. Trusting the step we just ran would rebuild
      # the same "green run, empty artifact" defect one layer up: the upload
      # action can skip files, partially fail, or be silently gated off, and
      # only the landed release tells the truth. Assert on the fact.
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Asset visibility is eventually consistent right after upload, so
          # poll briefly before declaring the release empty.
          ASSET_COUNT=0
          BUILD_COUNT=0
          BUILD_NAMES=""
          CHECKSUMS_ID=""
          CHECKSUMS_READ=false
          MISSING=""
          MANIFEST_BUILDS=0
          PROBE=""
          PROBE_URL=""
          PROBE_CODE=""
          CHECKSUMS_FILE=/tmp/published-checksums.txt

          # A non-empty asset list is NOT proof of a usable release. A release
          # carrying only a checksums.txt, a signature bundle, an SBOM or the
          # libgeyserlite.h C header has a positive asset count and still
          # offers nothing anyone can run. Counting assets is the same defect
          # as trusting a green run without checking what it produced, so
          # classify by name/type and require a real downloadable BUILD.
          BUILD_FILTER='[.assets[]
            | select(.state == "uploaded")
            | select(.name | test(
                "^checksums\\.txt$|^SHA(256|512)SUMS$|^LICENSE|^README|"
                + "\\.sig$|\\.sigstore\\.json$|\\.attest\\.spdx\\.json$|"
                + "\\.spdx\\.json$|\\.asc$|\\.pem$|\\.sha256$|"
                + "\\.h$|\\.hpp$|\\.md$|\\.txt$"
              ) | not)
            | select(.size > 0)]'

          for attempt in $(seq 1 12); do
            RELEASE_JSON=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            ASSET_COUNT=$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.state == "uploaded")] | length')
            BUILD_COUNT=$(echo "$RELEASE_JSON" | jq "$BUILD_FILTER | length")
            BUILD_NAMES=$(echo "$RELEASE_JSON" | jq -r "$BUILD_FILTER | .[].name")
            CHECKSUMS_ID=$(echo "$RELEASE_JSON" \
              | jq -r '.assets[] | select(.name == "checksums.txt" and .state == "uploaded") | .id' \
              | head -n1)
            CHECKSUMS_READ=false
            MISSING=""
            : > "$CHECKSUMS_FILE"

            if [ -n "$CHECKSUMS_ID" ] && gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$CHECKSUMS_ID" \
              -H 'Accept: application/octet-stream' > "$CHECKSUMS_FILE"; then
              CHECKSUMS_READ=true

              while read -r _ name; do
                [ -n "$name" ] || continue
                present=$(echo "$RELEASE_JSON" \
                  | jq -r --arg n "$name" \
                    '[.assets[] | select(.name == $n and .state == "uploaded")] | length')
                if [ "$present" -eq 0 ]; then
                  MISSING="$MISSING $name"
                fi
              done < "$CHECKSUMS_FILE"
            fi

            MANIFEST_BUILDS=0
            PROBE=""
            PROBE_URL=""
            PROBE_CODE=""
            if [ "$BUILD_COUNT" -gt 0 ] && [ "$CHECKSUMS_READ" = true ] \
              && [ -z "$MISSING" ]; then
              while read -r _ name; do
                [ -n "$name" ] || continue
                if echo "$BUILD_NAMES" | grep -Fxq "$name"; then
                  MANIFEST_BUILDS=$((MANIFEST_BUILDS + 1))
                fi
              done < "$CHECKSUMS_FILE"

              PROBE=$(echo "$BUILD_NAMES" | head -n1)
              PROBE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$PROBE"
              if ! PROBE_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$PROBE_URL"); then
                PROBE_CODE="000"
              fi
            fi

            if [ "$ASSET_COUNT" -gt 0 ] && [ "$BUILD_COUNT" -gt 0 ] \
              && [ -n "$CHECKSUMS_ID" ] && [ "$CHECKSUMS_READ" = true ] \
              && [ -z "$MISSING" ] && [ "$MANIFEST_BUILDS" -gt 0 ]; then
              case "$PROBE_CODE" in
                200|206) break ;;
              esac
            fi

            echo "Published assets are incomplete on $RELEASE_TAG (attempt $attempt); waiting..."
            sleep 10
          done

          echo "$RELEASE_JSON" | jq -r '.assets[] | "\(.name)\t\(.size)\t\(.state)"'
          if [ "$CHECKSUMS_READ" = true ]; then
            cat "$CHECKSUMS_FILE"
          else
            echo "checksums.txt contents unavailable."
          fi

          echo "Real build artifacts published ($BUILD_COUNT):"
          echo "${BUILD_NAMES:-  (none)}"

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG published with ZERO downloadable assets."
            echo "::error::A release with no artifact silently did not happen. Failing loudly."
            exit 1
          fi

          # Wrong-artifact-type is its own failure mode, distinct from empty.
          # It is the more dangerous one because the release looks populated.
          if [ "$BUILD_COUNT" -eq 0 ]; then
            echo "::error::Release $RELEASE_TAG has $ASSET_COUNT asset(s) but NO real build artifact."
            echo "::error::Only checksums/signatures/SBOMs/headers were published - nothing runnable."
            echo "::error::A positive asset count is not a release; a downloadable build is."
            exit 1
          fi

          # checksums.txt is the manifest every auto-download path fetches
          # first (go/download.go, rust/), so a release without it is
          # unusable even if other assets are present.
          if [ -z "$CHECKSUMS_ID" ]; then
            echo "::error::Release $RELEASE_TAG has $ASSET_COUNT asset(s) but no uploaded checksums.txt; the manifest is unresolvable."
            echo "::error::Consumer auto-download resolves <tag>/checksums.txt first and will 404."
            exit 1
          fi

          if [ "$CHECKSUMS_READ" != true ]; then
            echo "::error::Uploaded checksums.txt on $RELEASE_TAG could not be downloaded; the manifest is unresolvable."
            exit 1
          fi

          # Every artifact the manifest promises must actually be downloadable.
          # A checksums.txt that references missing assets 404s just as hard as
          # no release at all, only later and less visibly.
          if [ -n "$MISSING" ]; then
            echo "::error::checksums.txt on $RELEASE_TAG references assets that are not published; the manifest is unresolvable:$MISSING"
            exit 1
          fi

          # The manifest must promise a real build too. A checksums.txt that
          # lists only libgeyserlite.h resolves perfectly and still leaves
          # every consumer without a binary.
          if [ "$MANIFEST_BUILDS" -eq 0 ]; then
            echo "::error::checksums.txt on $RELEASE_TAG references no real build artifact; the manifest is unresolvable."
            exit 1
          fi

          # Finally prove one build is actually served, not merely listed by
          # the API. Range-request the first byte: a released asset that 404s
          # or is empty fails here rather than in a user's download.
          if [ "$PROBE_CODE" != "200" ] && [ "$PROBE_CODE" != "206" ]; then
            echo "::error::Build artifact $PROBE is listed on $RELEASE_TAG but not downloadable (HTTP $PROBE_CODE); the build is undownloadable."
            echo "::error::$PROBE_URL"
            exit 1
          fi

          echo "OK: $RELEASE_TAG publishes $BUILD_COUNT real build artifact(s) of $ASSET_COUNT assets;"
          echo "OK: checksums.txt resolves to all of them and $PROBE downloads (HTTP $PROBE_CODE)."

      # crates.io Trusted Publishing — no CARGO_REGISTRY_TOKEN secret needed.
      # See https://crates.io/docs/trusted-publishing
      # First-time setup: publish v0.0.0 manually with a temporary token,
      # then on crates.io go to "Settings → Trusted Publishing" for the
      # `geyserlite` crate and add a GitHub publisher with:
      #   repository:    minekube/geyserlite
      #   workflow file: release.yml
      #   environment:   release
      - name: Get a short-lived crates.io token via OIDC
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_crates_publish }}
        id: cargo-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish Rust crate
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_crates_publish }}
        # --allow-dirty: release-please bumps Cargo.toml but its TOML
        # jsonpath updater can't cleanly target the geyserlite entry in
        # Cargo.lock (filtered jsonpath isn't supported), so the lockfile
        # may be one version behind. cargo publish would auto-update the
        # lockfile and then refuse to ship because the working dir is
        # dirty. The actual published crate uses Cargo.toml's version,
        # which is correct, so dirty-lock is safe to skip.
        run: cargo publish --manifest-path rust/Cargo.toml --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}

  dispatch-gate-bump:
    needs: release
    if: startsWith(inputs.release_tag || github.ref_name, 'v')
    uses: minekube/actions/.github/workflows/dispatch-workflow.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      target-repository: gate
      target-workflow: bump-managed-dependency.yml
      target-ref: master
      inputs-json: |
        {
          "dependency": "geyserlite",
          "version": "${{ inputs.release_tag || github.ref_name }}",
          "source_repository": "${{ github.repository }}",
          "source_release_url": "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.release_tag || github.ref_name }}"
        }
    secrets: inherit
