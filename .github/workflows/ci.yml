name: CI

# Local and CI run the same `task` targets so they can't diverge.
# All tool versions come from mise.toml; mise-action installs them with caching.

# Path filters: lint+test only runs when something it actually checks
# changes. Doc-only edits skip CI. build/** is included because branch
# protection requires lint-test; build-only Renovate PRs otherwise cannot
# satisfy the required check even when native-image succeeds.
#
# The red `CI` check on every release PR is NOT a filter artefact and NOT a
# broken job — it is GitHub's approval gate for pull requests created with
# GITHUB_TOKEN: `pull_request` events with the opened/synchronize/reopened
# activity types from GITHUB_TOKEN "create workflow runs that require
# approval" (docs: Events that trigger workflows -> pull_request). Nobody
# approves them, so when release-please's PR is merged the run resolves to
# `failure` with 0 jobs (v0.5.31: run 36324253811 on #219, annotated "This
# workflow run required approval but was not approved before it expired";
# minekube/gate shows the same runs with the raw `action_required`
# conclusion). The release PR *does* match these paths — release-please
# rewrites go/version.go, rust/**, CHANGELOG.md and the manifest — which is
# why the run is created at all: a workflow whose filter does not match gets
# no run whatsoever (native-image.yml never runs on a release PR, and a
# docs-only PR produces zero runs).
#
# Consequence: never add `CI` (or `CI / …`) to main's required status checks.
# A release PR can never satisfy that context, so every release PR would stop
# being mergeable by the automation and the release chain would stall until a
# human removed the check. Release branches are validated by the ci.yml run
# that release-please.yml dispatches and mirrors onto `lint-test`, the only
# context required on main. Making the check real would require release-please
# to open its PR with a GitHub App/PAT token instead of GITHUB_TOKEN (docs:
# Trigger a workflow -> triggering a workflow from a workflow) — a credential
# change, not a workflow edit. go/release_check_contract_test.go pins all of
# the above.
on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - 'rust/**'
      - 'examples/**'
      - 'build/**'
      - 'mise.toml'
      - 'Taskfile.yml'
      - '.golangci.yml'
      - '.markdownlint*'
      - '.yamllint*'
      - '.github/actions/integration-setup/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/native-image.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'rust/**'
      - 'examples/**'
      - 'build/**'
      - 'mise.toml'
      - 'Taskfile.yml'
      - '.golangci.yml'
      - '.markdownlint*'
      - '.yamllint*'
      - '.github/actions/integration-setup/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/native-image.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dev tools (Go, Rust, Java/GraalVM, task, linters) via mise
        uses: jdx/mise-action@v4
        with:
          cache: true       # caches mise's tool installs
          experimental: true

      - name: Cache Go module + build cache, Cargo target
        uses: actions/cache@v6
        with:
          path: |
            .cache/go
            .cache/cargo-target
            ~/.cargo/registry
            ~/.cargo/git
          key: dev-${{ runner.os }}-${{ hashFiles('go/go.sum', 'rust/Cargo.lock', 'mise.toml') }}
          restore-keys: |
            dev-${{ runner.os }}-

      # mise's rust backend installs the toolchain but not its optional
      # components — rustfmt and clippy aren't implied by `rust = "1.85"`
      # in mise.toml. Add them explicitly via rustup before running lint.
      - name: Add rustup components (rustfmt, clippy)
        run: rustup component add rustfmt clippy

      - name: Setup
        run: task setup

      - name: Lint
        run: task lint

      - name: Test
        run: task test

  go-windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test Go module on Windows
        working-directory: go
        run: go test ./...
